# Render.com Blueprint for Enterprise Knowledge Assistant
# This file auto-configures all services on Render

services:
  # Frontend (React)
  - type: web
    name: enterprise-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: enterprise-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # Backend (FastAPI)
  - type: web
    name: enterprise-backend
    runtime: python
    buildCommand: cd backend && pip install -r app/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CHROMA_HOST
        value: ""
      - key: PYTHON_VERSION
        value: "3.10"
    healthCheckPath: /docs

# Database
databases:
  - name: enterprise-db
    plan: free
    databaseName: enterprise_db
    user: enterprise_user
